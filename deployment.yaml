apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-hello-world-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-hello-world
  template:
    metadata:
      labels:
        app: java-hello-world
    spec:
      containers:
      - name: java-hello-world
        image: yashadhav28/java-hello-world:latest
        imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: java-hello-world-service
spec:
  selector:
    app: java-hello-world
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
